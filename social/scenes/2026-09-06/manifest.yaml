# Clean product-scene renders — 2026-09-06 batch (Vilvah / Pluchi / Aagghhoo)
# =============================================================================
# WHAT: the CLEAN, un-watermarked Blotato Product-Scene renders used as the social
#   collection-carousel slides AND (for the 3 pin heroes) attached as the index-0
#   gallery lead of the DEV listing via scripts/attach-social-scene.js (P1 pin->listing
#   scent-match). These are the durable source-of-truth copies.
#
# WHY THIS FILE EXISTS: the only other copies live on Blotato public storage
#   (database.blotato.io/.../public_media/) which we do NOT control the retention of,
#   and in an ephemeral session scratchpad (now gone). Sharetribe image IDs are
#   env-specific, so the DEV uploads cannot be reused on PROD. If the Blotato URL
#   expires before the prod migration, the scene would silently drop. These repo
#   copies remove that dependency.
#
# DEV->PROD MIGRATION (how the scene reaches prod, and how to keep it):
#   create-listings.js --prod reads Prod_Uploaded_Image_IDs (empty) -> no short-circuit
#   -> it RE-UPLOADS from `Product Image URL` (index-0). Today that index-0 is the
#   Blotato URL. To be retention-proof, BEFORE the prod run re-point each row's
#   `Product Image URL[0]` (in the classified_products_prod CSV) at the durable copy
#   here (host it on a Mela-owned URL, or re-run attach-social-scene.js --prod --image-url
#   <this file, hosted> after the prod listing exists). attach-social-scene is idempotent
#   (skips unless --force; keyed off publicData.socialSceneImageId).
#   NOTE: create-listings.js against the CURRENT dev CSV does NOT remove the dev scene
#   (Dev_Uploaded_Image_IDs short-circuit returns it at index-0).
#
# blotato_clean_url base: https://database.blotato.io/storage/v1/object/public/public_media/40ff5931-a86e-4c86-8caf-693002fc13d9/videogen2-render-<id>.jpg

