<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mela — Hook Card</title>
<link rel="stylesheet" href="mela-kit.css">
<style>
  /* Hook card: slide 1 for a cultural_education post. A curiosity hook,
     NEVER a product. See visual-style-guide.md -> Education Visual System. */
  .card { justify-content: center; }
  .headline { font-size: 9.6vmin; line-height: 1.05; color: var(--ink); margin: 0; }
  .headline .accent { color: var(--navy); font-style: italic; }
  .subline { font-size: 5.2vmin; color: var(--muted); margin-top: 3.5vmin; font-style: italic; }
</style>
</head>
<body>
  <div class="card">
    <!-- EDIT: topic label -->
    <div class="kicker">Block printing</div>
    <div class="rule"></div>
    <!-- EDIT: headline. Wrap ONE word in <span class="accent"> for the navy-italic pop. -->
    <h1 class="headline">No two are<br>ever <span class="accent">identical</span>.</h1>
    <!-- EDIT: subline (optional) -->
    <div class="subline">Here's why.</div>
    <div class="watermark">Discovered on <b>Mela</b></div>
  </div>
</body>
</html>
