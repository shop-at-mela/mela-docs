---
# Category Routing — canonical, executable routing config. Read by /social-launch + /social-review (Phase 2).
# Category → platform lead, persona, board, format, visual accent. Skills read this; they don't re-derive it.
# WHY (funnel rationale) → social-content-strategy-prd.md · HOW visuals look → visual-style-guide.md.

meta:
  version: 1
  last_updated: "2026-08-30"
  # `stage` is a human descriptor, NOT a switch. The two things that actually gate behavior moved
  # independently, so there's no single "phase": Pinterest maturity lives in cadence (below); the IG
  # grid gate lives in grid.enabled + grid.activation_gate. (Retired the old active_phase enum 2026-08-12.)
  stage: "cold-start — Pinterest live via Blotato API (warmup cleared 2026-08-08); IG grid deferred (gate: grid.enabled)"

# Platform funnel roles + where links point
platforms:
  pinterest:
    role: top_of_funnel_discovery
    link_target: listing_page      # https://www.shopatmela.com/l/{Dev_Listing_ID}
  instagram:
    role: mid_funnel_trust
    link_target: brand_page        # https://shopatmela.com/brands/{brand_slug}
    # Story formats (brand_spotlight_carousel: fashion, art_and_craft) append /about — the full
    # brand_story only renders there; the default products tab shows only the tagline. Product-only
    # formats keep the bare brand_page URL.
    link_target_about_suffix: "/about"   # https://shopatmela.com/brands/{brand_slug}/about

# UTM — appended to every destination URL before it enters a caption/pin. Untagged = defect.
# Feeds GA4 clickout attribution by platform+campaign (see social-content-strategy-prd.md).
tracking:
  utm_required: true
  schema: "?utm_source={platform}&utm_medium=social&utm_campaign={brand_slug}_w{week}&utm_content={product_slug_or_content_type}"
  utm_source_values: { instagram: instagram, pinterest: pinterest, reddit: reddit }
  example: "https://www.shopatmela.com/l/6a17b614-...?utm_source=pinterest&utm_medium=social&utm_campaign=fizzygoblet_w2&utm_content=bali_bellini_kolha_flats"

# Posting cadence. Every-other-day spacing is the hard rule; the per-channel lines are current volume.
# IG feed cadence is a multiple of 3 (theme-rows); Stories are grid-neutral and absorb overflow.
cadence:
  # No Blotato queue slots (useNextFreeSlot errors), so pass each post scheduledTime = prev + 24h explicitly.
  posting_interval: daily   # 24h between posts (changed from every_other_day 2026-08-12); source of truth for both skills' scheduling
  # CURRENT (cold-start) — what both skills follow now:
  pinterest: "Posts via Blotato like Instagram; cap 10/24h per account, schedule overflow past the cap"  # warmup cleared 2026-08-08 (memory project_mela_social_status)
  instagram: "SHORT-FORM PRIMARY (updated 2026-08-14): 4-5 short-form Reels/week as the primary reach format (product / how-it's-made / anchor — see hook-engineering.md §4) + supporting carousels/stills; no grid while grid.enabled=false. Every reel lands a payoff (not a payoff-less wordmark teaser). Runs above the PRD's ≤3hr/week budget — lean on Blotato semi-automation, accept rough-but-fast."
  # FUTURE (aspirational, NOT active) — adopt when grid.enabled flips on (grid.activation_gate) + Pinterest Catalog Feed ships:
  target:
    pinterest: "5-10 pins/day, Catalog Feed auto"
    instagram: "9 feed posts/week (3 grid rows: 2 brand + 1 education), several shipping as short-form reels (4-5/week primary reach) + daily Stories"

# Rotation guardrails — enforced against campaign logs (social/log/[brand-slug]/week-*.yaml)
rotation:
  brand_recency_days: 7                       # same brand posted within N days → suggest alternative
  persona_fatigue: { window: 5, max_same: 3 } # same persona 3+ of last 5 → rotate
  category_concentration: { window: 3, max_same: 3 }  # 3+ consecutive same category → require different
  # COOLDOWN, not a ban — a finite catalog re-surfacing after the window is fine. Match by
  # dev_listing_id across all campaign logs (instagram.products[] + pinterest.pins[]).
  # Only count entries with a confirmed publish (status: posted, or a submission_id whose
  # blotato_get_post_status came back published/scheduled) — a queued/unconfirmed/no-status
  # entry is not proof the product went out and must not suppress a real repeat, nor be trusted
  # as "already covered." Pre-2026-08-08 Pinterest entries (manual-warmup era, Blotato API
  # blocked) mostly lack this — treat them as unverified, not as posted.
  # Raised 60 -> 240 (2026-08-30) after The Alternate's "Abstract Embroidery Slip-Ons" repeated
  # on Instagram after only 55 days (within the old 60-day window, but the Phase 2 check wasn't
  # run/surfaced for that post — see social-review SKILL.md Phase 2 cooldown-check line).
  product_recency_days: 240  # ~8 months; same product within N days → suggest a different one from the same brand

# Instagram feed grid — theme-row layout (IG ONLY; Pinterest has no row logic).
# Feed is planned in rows of 3 sharing one brand OR one education theme. Weekly batch = 3 rows. See /social-launch Phase 2.
grid:
  enabled: false                 # DEFERRED (2026-07-13) — reach (Pinterest SEO, standalone IG) is higher-ROI
                                  # until the profile has visitors. See activation_gate.
  activation_gate: "Re-enable once IG Insights shows a steady count of profile visits/website taps from non-followers per week (metrics sheet; cold-start-checklist.md → Sunday). Before that, no audience is on the profile to navigate."
  while_off: "While enabled=false: PRODUCT-FORWARD grid face on every brand/product post (reel frame 1 / carousel cover = the hero product); text-card covers for EDUCATION posts only; do NOT produce anchor wordmark cards or force the 3-tile brand-row structure (both are grid-navigation devices with no payoff until the grid is on). See visual-style-guide.md → 'Grid face: product-forward while the grid is off'. Diagnosis: 2026-08-16 grid review (wall-of-text-cards)."
  platform: instagram            # never applies to Pinterest
  row_size: 3                    # feed posts per row; keep feed cadence a multiple of this
  rows_per_week: 3               # weekly batch = 3 rows = 9 feed posts
  weekly_rows:
    brand_rows: 2                # MUST be two DIFFERENT Mela categories
    theme_rows: 1                # one education row (education-topics.yaml)
  anchor:
    tile: center                 # navigation label sits in the middle tile
    forms: [teaser_reel, theme_card]
    default: teaser_reel          # anchor form. Anchor teasers are ~2/week — a SUBSET of the 4-5 short-form/week total (the rest are product/education reels, see cadence.instagram + hook-engineering.md §4). Anchor teaser MUST land a payoff beat, not just converge to the wordmark. Semi-automated (see reel_production_note)
    fallback: theme_card          # when a reel can't be produced that week. Note: IG grid-reorder (June 2026) can retrofit a static card into a row later, but not a Reel (reels can't be repositioned; see ordering_rule)
    role: "Names the row's brand/category/theme so visitors can navigate; the center column forms a vertical spine across weeks."
    flanks: "Two side tiles are supporting posts (craft/founder story + product), styled to sit with the anchor."
  row_composition:
    brand_row: "3 posts for ONE in-QA/live brand: center anchor + 1 product tile + 1 craft-story/founder tile. Only the product tile cross-posts to Pinterest."
    theme_row: "1 education-topics.yaml topic — IG-only (trust_service or cultural_education)"
  brand_row_rotation: "the 2 brand rows in a week MUST be two different Mela categories (see rotation.category_concentration)"
  ordering_rule: >
    Photo/carousel tiles: use IG's native grid-reorder (June 2026), drag into position after the fact.
    Reels can't be reordered — leftmost publishes last, center 2nd, right first; across rows publish
    bottom-to-top so the intended top row's top-left tile posts last (top row is chooseable per week).
  discipline:
    - "Feed content in multiples of row_size (full week = 9). One extra post scrambles every historical row."
    - "Full rows only. Route ad-hoc items to Stories or make them next week's anchor."
    - "The top (newest) row is 'in progress' until all 3 tiles are live — expected."
  teaser_gating:  # guards the copy-positioning rule + Neha's availability dealbreaker
    coming_soon_ok_if: "brand genuinely NOT yet live on Mela (in-QA per education-topics brand_pool)"
    live_brand_wordmark: "'Now on Mela' / 'Discover on Mela' — NEVER 'coming soon' for a live brand"
  reel_production_note: "Semi-automated: Blotato builds the motion collage, but trending audio + final publish are a manual in-IG step. Anchor teasers ~2/week (subset of 4-5 short-form/week total). Every reel — anchor, product, or how-it's-made — must land a payoff beat (hook-engineering.md §4); fall back to a static theme_card only if a reel truly can't be made."
  asset_spec:
    grid_crop: "3:4 portrait — IG grid crops to portrait; keep anchor text in the safe zone (see visual-style-guide.md)"

# Pinterest board strategy (decided 2026-07-24). POLICY: a fixed set of evergreen THEME boards
# contributed to by every relevant brand — NOT a new board per post/brand (one-off boards never
# accrue the topical authority Pinterest ranks on). A brand board may exist in addition once earned
# (brand_board_threshold), but a pin's PRIMARY board is always the category theme board.
# Full rationale: pinterest-playbook.md → Board architecture.
pinterest_boards:
  brand_board_threshold: 8  # min live pins before a brand earns its own supplementary board
  # Board-type policy (2026-08-06): category + occasion KEEP; gift MERGED into occasion (one
  # "Gifting and Occasions" board); brand SKIP at cold start (revisit after threshold + real traffic;
  # brands stay first-class on IG). Cold-start target ~6 boards.
  board_type_policy: "category + occasion primary; gift merged into occasion; brand boards skipped at cold start (see pinterest-playbook.md)"
  # New cross-cutting attribute (sustainability, plus-size, a craft micro-niche, etc.) proposing a
  # board? Run the checklist first: pinterest-playbook.md → "New theme/attribute board? Run this
  # checklist first" (§2, added 2026-08-30). Default is a keyword layer on an existing board, not a
  # new board — see the sustainability_and_vegan worked example in §4.
  # Resolution (both skills, Phase 2/6): look up the category's boards.pinterest placeholder here →
  # pass board_id straight to blotato_create_post boardId. Re-verify via blotato_list_pinterest_boards on a 404.
  boards:
    home:                        { board_name: "Home and Kitchen",        board_id: "1103593152379723626", status: live }
    occasion:                    { board_name: "Gifting and Occasions",   board_id: "1103593152379723628", status: live }
    gifting:                     { board_name: "Gifting and Occasions",   board_id: "1103593152379723628", status: live }  # same board as `occasion` — one combined board, not two
    "Modern Indian Nursery":     { board_name: "Modern Indian Nursery",   board_id: "1103593152379723629", status: live }
    "Organic Baby Essentials":   { board_name: "Organic Baby Essentials", board_id: "1103593152379723630", status: live }
    beauty:                      { board_name: "Beauty Ritual",           board_id: "1103593152379723631", status: live }
    wellness:                    { board_name: "Beauty Ritual",           board_id: "1103593152379723631", status: live }  # same board as `beauty`
    brand:                       { board_name: "Artisan Footwear",        board_id: "1103593152379641541", status: live }  # FOOTWEAR ONLY (juttis, sneakers, sandals) — do not use for apparel
    apparel:                     { board_name: "Indian Ethnic Wear & Hand-Embroidered Fashion", board_id: "1103593152379779116", status: live }  # created 2026-08-08; non-footwear fashion (kurtas, sarees, embroidery, handloom)
  existing_brand_boards:
    # ARCHIVED 2026-08-06 — consolidated into theme boards (Fizzy Goblet → Artisan Footwear). Don't route pins here. Reversible; revisit post-traction.
    - "Fizzy Goblet"    # archived 2026-08-06
    - "The Alternate"   # archived 2026-08-06
  fallback_board: "Brands from India"  # ONLY when no theme board exists for a category; flag the gap to the user regardless
  seasonal_boards:
    # Evergreen, re-seeded yearly. Created ahead of the lead time in accounts.md → Seasonal Calendar.
    - { name: "Diwali Gifting",      live_by: "mid-August" }
    - { name: "Holi Colors",         live_by: "mid-December" }
    - { name: "Mother's Day Edit",   live_by: "mid-February" }
    - { name: "New Year, New Home",  live_by: "mid-October" }

# Content types — PLATFORM IS DECIDED BY TYPE, NOT CATEGORY. Product cross-posts to both platforms
# for every category; non-product is single-platform by nature (never a category exclusion).
content_types:
  product:            # single / collection / brand-spotlight posts + pins
    platforms: [instagram, pinterest]
    note: "All categories cross-post. Instagram = 1 carousel; Pinterest = 1 pin per product."
  trust_service:      # 5-7 day shipping, product quality, customer service, returns
    platforms: [instagram, reddit]
    note: "Purchase-objection content. Pinterest is discovery mode — not where people evaluate shipping/CS."
  cultural_education: # craft heritage, technique, origin ('block printing, 500 years old')
    platforms: [instagram]
    note: "Reels/feed. Optional light Pinterest process-pin only if strongly visual."

# Routing table — one entry per Mela category (routes PRODUCT content; both platforms always)
categories:
  home_and_kitchen:
    platform_lead: pinterest
    personas: [priya, arun]
    boards:
      pinterest: [home, occasion]
      instagram: feed
    format: collection_carousel
    visual_accent: "functional context; glaze / wood-grain detail"

  baby_and_kids:
    platform_lead: pinterest
    personas: [sarah, priya]
    boards:
      pinterest: ["Modern Indian Nursery", "Organic Baby Essentials"]
      instagram: feed
    format: collection_carousel
    visual_accent: "safety, comfort, soft pastels"

  jewelry_and_accessories:
    platform_lead: pinterest
    personas: [priya, neha]
    boards:
      pinterest: [gifting, occasion]
      instagram: feed
    format: collection_carousel
    visual_accent: "macro metalwork; flat-lay on linen"

  food_and_gourmet:
    platform_lead: pinterest
    personas: [priya, sarah]
    boards:
      pinterest: [gifting, occasion]
      instagram: feed
    format: single_or_collection
    visual_accent: "appetizing warm light; ingredient context"

  beauty_and_wellness:
    platform_lead: pinterest
    personas: [sarah]
    boards:
      pinterest: [beauty, wellness]
      instagram: feed
    format: single_or_collection
    visual_accent: "spa-calm; natural ingredients"

  fashion:
    platform_lead: instagram
    personas: [arun, sarah]
    boards:
      # Splits by product type: footwear → `brand` (Artisan Footwear); other apparel
      # (kurtas, sarees, embroidered/handloom) → `apparel`. Pick per-product at campaign time.
      # Sustainability/vegan (e.g. The Alternate) stays on these SAME boards — it's a pin-level
      # keyword layer, not a separate board. See pinterest-playbook.md → sustainability_and_vegan
      # (decided 2026-08-30; revisit only once brand_board_threshold + a 2nd brand justify a board).
      pinterest: [brand, apparel]
      instagram: brand_spotlight
    format: brand_spotlight_carousel
    visual_accent: "embroidery / weave closeups; drape"

  art_and_craft:
    platform_lead: instagram
    personas: [arun]
    boards:
      pinterest: [brand]   # same naming rule as fashion, above
      instagram: educational
    format: educational_carousel
    visual_accent: "brushwork; handmade imperfection"
