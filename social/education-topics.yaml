# Education Topics — weekly non-product content queue
# Feeds the `trust_service` and `cultural_education` content types (see category-routing.yaml).
# /social-launch and /social-review pick ONE topic per week, alternating type.
# Platform per topic follows `content_types` in category-routing.yaml (by TYPE, not category).
#
# Sourced from the Mela brand pipeline sheet (Google Sheets, gid=704623254), July 2026.
# IMPORTANT: entries with `verify: true` contain craft/quality specifics that MUST be
# confirmed on the brand's own page before publishing — do not claim unverified craft or
# certification details (Sarah/Neha guardrails: no vague/unsubstantiated claims).
#
# These topics are also the seed list for the informational content hub / blog (AEO next
# step) — see `aeo-next-steps.md` §2. Long-form articles repurpose these same verified
# angles rather than being researched separately; do not add a blog-only topic type here,
# it would confuse the weekly picker's trust_service/cultural_education rotation.

meta:
  version: 1
  last_updated: "2026-07-04"
  cadence: "1 topic per week; alternate trust_service <-> cultural_education"
  selection: >
    Pick a status:backlog topic; prefer a brand that is live or in-QA on Mela (see brand_pool).
    On use, set status:used and record week_used. Verify any `verify:true` claim first.

