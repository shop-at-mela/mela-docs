    note: >
      Selected 2026-07-31 for Week 2 batch, anchored on Ankid (not Banjaaran Studio).
      Banjaaran's classified CSV listed block print items, but its live catalog turned out
      to be all footwear with illustrated faux leather, not textile block printing, so it
