      use (see ankid/week-2-education-campaign.yaml). See social-launch SKILL.md's
      product-data verification guardrail for why individual verification was needed even
      after picking a brand with a correct top-level claim.
      UPDATE 2026-08-01: the per-product "right tag, wrong product" mismatches that made
      individual verification necessary here were root-caused to a Dev_Listing_ID write-back
      index-drift bug in the listing pipeline (out-of-stock rows shifted every subsequent ID
      one row earlier), NOT a scraper/classifier fault. The pipeline now keys write-back by
      SKU and Ankid's CSV has been reconciled against live Sharetribe (see
      ankid/week-2-campaign.yaml observations → product_data_unreliable root_cause/resolution,
      and scripts/reconcile-listing-ids.js). The verify-live guardrail still stands as good
      practice, but Ankid's CSV row→listing mapping is now trustworthy.

