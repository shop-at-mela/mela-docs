parked_ideas:
  - id: brand-ddp-advocacy-01
    audience: brands            # brand-facing, NOT the buyer personas
    angle: "Prepay duties (DDP) so US shoppers see one landed price at checkout — why it lifts conversion"
    rationale: >
      Idea from user 2026-08-05. Many Indian brands ship without prepaid duties, so US
      buyers hit surprise fees on delivery — a major drop-off. A brand-facing message
      (partnerships/outreach, e.g. LinkedIn or the brand outreach flow, NOT consumer IG)
      encouraging brands to adopt DDP makes Mela-discovered shopping frictionless.
    channel: partnerships_outreach  # see outreach-templates.md, not the consumer feed
    status: idea

