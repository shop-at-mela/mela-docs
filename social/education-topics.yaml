---
# Education Topics — weekly non-product content queue
# Feeds the `trust_service` and `cultural_education` content types (see category-routing.yaml).
# /social-launch and /social-review pick ONE topic per week, alternating type.
# Platform per topic follows `content_types` in category-routing.yaml (by TYPE, not category).
#
# Sourced from the Mela brand pipeline sheet (Google Sheets, gid=704623254), July 2026.
# IMPORTANT: entries with `verify: true` contain craft/quality specifics that MUST be
# confirmed on the brand's own page before publishing — do not claim unverified craft or
# certification details (Sarah/Neha guardrails: no vague/unsubstantiated claims).
#
# These topics are also the seed list for the informational content hub / blog (AEO next
# step) — see `aeo-next-steps.md` §2. Long-form articles repurpose these same verified
# angles rather than being researched separately; do not add a blog-only topic type here,
# it would confuse the weekly picker's trust_service/cultural_education rotation.

meta:
  version: 2
  last_updated: "2026-08-05"
  cadence: "1 topic per week; alternate trust_service <-> cultural_education"
  framing: >
    LIVING CULTURE, NOT HERITAGE (added 2026-08-05). Frame every cultural_education
    topic as craft that is alive and made NOW — who makes a living from it today, why a
    contemporary brand still does it by hand in 2026 — not as an ancient "500-year-old
    tradition" or museum relic. This matches Mela's actual catalog (contemporary brands
    reinterpreting craft: Nicobar, Kaunteya, Isharya), earns AEO value, and avoids the
    exoticizing/othering trap. Every cultural_education topic carries a `contemporary_angle`;
    the caption and slide 1 LEAD with it, not with "handed down through generations."
    Same reframe governs website brand/category copy — see shopify_brands.py brand-voice
    house rule and seo-aeo-category-brand-pages-prd.md.
  visual_system: >
    Education posts do NOT use the product-visual pipeline. Slide 1 is a HOOK, never a
    product; the product (if any) is the last "payoff" slide. See visual-style-guide.md ->
    Education Visual System and /social-review Phase 3d. Produce with the Canva-free toolchain
    (HTML/CSS -> PNG first, Blotato illustrative stills, Canva last).
  selection: >
    Pick a status:backlog topic; prefer a brand that is live or in-QA on Mela (see brand_pool).
    On use, set status:used and record week_used. Verify any `verify:true` claim first.
  replenishment: >
    ADDED 2026-07-31 after craft-ayurveda-beauty's vilvah claim was found unverifiable
    (see that entry's note). When the backlog runs low, or a batch's brand has no matching
    topic, regenerate candidates with this method rather than inventing claims:
      1. Pull verified brand_craft + brand_story text per brand from shopify_brands.py
         (grep '"brand_craft": "[^"]' | grep -v placeholder — skip blank/placeholder entries,
         those aren't launch-ready copy yet).
      2. Cross-check any claim against the classified product CSV's tags (Item_Aspects /
         Key Features column) if the brand also has one — CSV tags are classifier-generated
         and can be wrong (see the vilvah/Ayurvedic case); shopify_brands.py's brand_story
         is the higher-trust source when the two disagree.
      3. De-dup against existing topics.source_brands so a brand/craft angle isn't repeated.
      4. Favor brands already in this week's product-post lineup (Phase 1 brand selection)
         so the education post can pair thematically with a brand row, but it's not required —
         brand-agnostic trust_service topics (shipping, customs, vetting, etc.) don't need this.
      5. Mark every new craft/quality claim `verify: true` — confirm on the brand's own site
         before the post ships, same bar as the original 12 topics.
    This method is not yet automated — topic *generation* (this method) and topic
    *selection* per week are both currently manual passes.

topics:
  # ---- Trust / service (brand-agnostic; always relevant to diaspora buyers) ----
