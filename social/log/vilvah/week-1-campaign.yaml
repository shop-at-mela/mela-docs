        Removed "No synthetic chemicals" from the story card and re-rendered. Kept only verifiable
        sourcing (farm grown, goat milk, cold pressed, bottled on-site). Captions also avoid the
        "Ayurvedic" tag (a Mela-side classifier label, not Vilvah's own positioning).

