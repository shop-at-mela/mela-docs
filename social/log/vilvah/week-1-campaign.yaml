      description: >
        Draft Vilvah story card asserted "No synthetic chemicals" (from shopify_brands.py brand_story).
        The featured product's own live label lists synthetic cosmetic ingredients (potassium sorbate,
        caprylic/capric triglyceride, etc.), so the absolute is false. Same class of unverifiable-claim
        risk that got Vilvah dropped from an earlier batch (its Ayurveda claim).
