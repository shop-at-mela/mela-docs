<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mela — Brand Spotlight</title>
<link rel="stylesheet" href="mela-kit.css">
<style>
  /* Brand spotlight card: a story slide for a brand post. Large serif brand
     name, a one-line what-it-is, a short living-culture story, and a
     "Discover on Mela" close. Pairs with a real lifestyle photo slide. */
  .card { justify-content: center; }
  .brand { font-size: 13vmin; line-height: 1; color: var(--ink); margin: 0; text-align: center; }
  .brand .accent { color: var(--navy); font-style: italic; }
  .what {
    font-family: var(--sans); text-transform: uppercase; letter-spacing: 0.5vmin;
    font-size: 2.8vmin; font-weight: 700; color: var(--marigold); margin-top: 4vmin; text-align: center;
  }
</style>
</head>
<body>
  <div class="card" style="align-items:center; justify-content:center;">
    <!-- EDIT: kicker -->
    <div class="kicker">Now on Mela</div>
    <div class="rule"></div>
    <!-- EDIT: brand name -->
    <h1 class="brand">Vil<span class="accent">vah</span></h1>
    <!-- EDIT: tagline -->
    <div class="what">Farm fresh skincare, Tamil Nadu</div>
    <div class="watermark">Discovered on <b>Mela</b></div>
  </div>
</body>
</html>
