      description: >
        Both Nesavu pins (Baby Girl First Birthday pavadai, Toddler Navratri pavadai) now exist
        twice on Pinterest — once posted manually by the user a few days before 2026-08-08 while
        the account was still in Blotato's Pinterest warmup block, and again auto-posted by
        Blotato on 2026-08-09 (submissions 942b7735-efa0-47d4-a057-8ab824a8b8f0 and
        dd72f764-9f59-4e13-9708-0251b7c37bb1) once the block cleared. The campaign log had these
        pins queued as `status: scheduled` and had no record of the manual post, so Blotato had
        no way to know they'd already gone up. Root cause: the Phase 2 freshness check only reads
        campaign YAML history, which doesn't capture out-of-band manual posts made directly on a
        platform.
      mitigation: >
        RESOLVED 2026-08-31: user deleted both manual duplicate copies (pin/1103593083717050325,
        pin/1103593083717050327), keeping the Blotato-tracked pins (see per-pin `pin_url` above) since
