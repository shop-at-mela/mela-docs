  caption: |
    Hand block printing starts with a block of wood, carved by hand into a pattern, then dipped in dye and pressed onto cotton one stamp at a time. No screen, no machine. Every repeat is placed by a printer's eye and hand, which is why two pieces from the same run are never perfectly identical.

    Ankid uses this technique across its festival wear for children, printing directly onto cotton with wooden blocks before a single seam is sewn.

    It is slower than digital printing and it shows: slightly uneven lines, a print that breathes with the fabric instead of sitting on top of it.

    Look closely at your next block printed piece. The small variations are the proof it was made by hand, not a flaw to overlook.

    Discover @ankid.in on Mela, link in bio

    📍 Block printed by hand in India
    #HandBlockPrint #IndianCraft #BlockPrinting #MadeInIndia #Ankid

