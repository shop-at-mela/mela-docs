  caption: |
    Block printing is not a museum piece. It is a living craft. Carved wooden blocks are still stamping cotton by hand in working print houses across Rajasthan and Gujarat, this season, for contemporary kidswear like Ankid. Not nostalgia. Now.

    Here is how it works. A pattern is carved by hand into a block of wood, dipped in dye, and pressed onto cotton one stamp at a time. No screen, no machine. Every repeat is placed by a printer's eye and hand, which is why two pieces from the same run are never perfectly identical.

    Ankid prints directly onto cotton with wooden blocks before a single seam is sewn. It is slower than digital printing and it shows. Slightly uneven lines. A print that breathes with the fabric instead of sitting on top of it.

    Look closely at your next block printed piece. The small variations are the proof it was made by hand, not a flaw to overlook.

    Discover Ankid on Mela, link in bio

    📍 Block printed by hand in India
    #HandBlockPrint #IndianCraft #BlockPrinting #MadeInIndia #Ankid

