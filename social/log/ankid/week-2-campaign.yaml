# UX REVIEW
ux_review:
  destination_url: https://shopatmela.com/brands/ankid
  checks:
    brand_story:
      result: pass
      note: Loaded cleanly 2026-07-31, full hero, tagline, "Vetted by Mela" badge, 234 products.
    product_findability:
      result: pass
      note: Product names included in caption
    mobile_responsive:
      result: pass
      note: Checked at 430px width 2026-07-31, hero image and brand info rendered cleanly, no layout break. First campaign this check has actually been completed for, rather than left tbd.
  observations:
    - theme: product_data_unreliable
      severity: high
      status: fixed  # 2026-08-01
      description: >
        At campaign time Ankid's CSV had many rows tagged with the right craft but pointing at
        the wrong live product (e.g. a "hand block printed" row resolving to a ruffle dress), so
        all 4 featured products were hand-verified live and 2 used curated brand_hero_listing_ids
        instead of CSV rows. Root-caused 2026-08-01 to a listing-pipeline Dev_Listing_ID
        write-back drift bug (not a scraper/classifier fault); pipeline fixed to key write-back
        by SKU and Ankid's CSV reconciled against live Sharetribe (234/234 rows corrected,
        verified). Ankid CSV row→listing mapping is now trustworthy for captions.
        Engineering detail: project_listing_id_drift_bug memory + scripts/reconcile-listing-ids.js.
    - theme: listing_image_quality
      severity: medium
      status: open
      description: >
        NEW 2026-08-01, distinct from product_data_unreliable above. That one was ID mapping and
        is fixed. This is the images WITHIN correctly resolved listings. Three problems found by
        opening every gallery image for all 4 products:
        (1) Hero image is often not the product. The bandana listing's hero is a gingham dress on
        a child; the bandana appears only as a headband. Anything that grabs a listing hero
        programmatically will pull the wrong garment.
        (2) Non-product images sit inline in the gallery. The bandhgala listing has a size chart
        as gallery image 3 and a face portrait as image 4. Only 1 of its 4 images shows the product.
        (3) Listing titles can contradict the photo. The bandana is titled "in Pink" and is
        visibly rust/terracotta.
      mitigation: >
        Per campaign workaround only: every source_image_url in this file was picked by eye, not
        by hero position, and each carries a source_image_note explaining the choice. Caption and
        pin copy changed from "pink" to "rust" to match the photo; the carousel bullet dropped the
        colour word so it still matches the listing name without asserting a wrong colour.
        Route to the data/listings team: (a) listings need a designated primary product image,
        (b) size charts and portraits should not sit in the product gallery, (c) Ankid's bandana
        listing title needs correcting at source, which also fixes the caption divergence.

    - theme: destination_not_linked
      severity: medium
      status: open
      description: Same root cause as tarinika-week-1 — IG captions aren't clickable; bio link is generic homepage, not brand-specific.
      mitigation: Caption CTA reworded to "link in bio" for accuracy. Bio link / link-directory fix still open.

