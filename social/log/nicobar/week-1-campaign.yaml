# UX REVIEW
ux_review:
  destination_url: https://shopatmela.com/brands/nicobar
  checks:
    brand_story:
      result: pass
      note: Brand page loads with story + 500 products; states "ships to all 50 US states". Verified 2026-08-06.
  observations:
    - theme: slide_order_correction
      severity: low
      status: resolved
      description: >
        Auto-generated submission had the spotlight/text card as slide 1 and the tea-set
        lifestyle scene as slide 2. User manually swapped this before publish so the
        photo leads. No documented spec mandates spotlight-card-first order (checked
        social-content-strategy-prd.md and category-routing.yaml — neither specifies
        slide order, only slide content). Every other published Mela carousel
        (Ankid, Kaunteya, Gully Labs, ChooseKind) leads with product/lifestyle
        photography, not a text/logo card, consistent with the cover-slide being the
        scroll-stopper. Reviewed against general IG carousel practice: a branded
        text card performs better as a closing/CTA slide than as the cover.
      mitigation: >
        Keep the corrected order. Recommend the pipeline default to photo-first,
        spotlight-card-last for future brand_spotlight_carousel posts, so this doesn't
        need a manual fix each time.
    - theme: carousel_length_below_spec
      severity: medium
      status: open
      description: >
        social-content-strategy-prd.md (line 90) specs Brand Spotlight Carousels at
        6-8 slides: "brand origin story, 3+ product highlights, link to Mela brand
        page." This post shipped with 2 slides total (1 lifestyle photo + 1 spotlight
        card) — zero dedicated product-highlight slides, well under both the spec and
        the 4-6 image norm seen across every other Mela IG carousel this batch. The
        caption itself claims a multi-category "world" (linen shirts, cotton dresses,
        ceramic tableware, cushions, candles) that the 1-photo visual doesn't back up.
        The stated reason for going product-post-light (Nicobar's individual listings
        resolving to "closed"/drifted, see brand_story_not_product note above) only
        blocks *linking* a specific SKU — it doesn't block using additional real
        Nicobar lifestyle photos as illustrative imagery, since the whole post already
        routes to the general brand page, not per-slide listing links.
      mitigation: >
        Not fixed retroactively (post already published 2026-08-09). For the next
        Nicobar post or any brand_spotlight_carousel: pull 3-5 more real lifestyle/
        product photos spanning the brand's category range (apparel + home, in
        Nicobar's case) to fill out the spec's 6-8 slides, ending on the spotlight/
        CTA card per the slide_order_correction note above.

