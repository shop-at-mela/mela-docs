  observations:
    - theme: destination_broken
      severity: high
      status: open
      description: >
        shopatmela.com/brands/kaunteya renders a completely blank white page, reproduced
        4/4 times. Root cause traced via browser console: the map component tries to load
        mapbox-sdk.min.js via a proxy (discoveronmela.onrender.com), that request 503s, and
        the failure-handling path calls an undefined function (`showUserError`), throwing an
        uncaught ReferenceError during componentDidMount with no error boundary to catch it —
        killing the entire React mount. Confirmed NOT universal: Fizzy Goblet and Tarinika
        brand pages loaded fine repeatedly in the same session, so this is data/route-specific
        to Kaunteya, not a site-wide outage (a separate, unrelated Render cold-start was also
        observed and self-resolved earlier in the same session — do not conflate the two).
      mitigation: >
        None yet — this is a dev bug requiring either (a) fixing/guarding the missing
        showUserError reference, or (b) making the map fail gracefully (omit the map) instead
        of crashing the whole page. Post built and ready per user decision (2026-07-22) to
        prepare content now and hold publish until the page is fixed. Route to product/dev
        backlog.
