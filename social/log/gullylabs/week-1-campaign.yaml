  caption: |
    Gully Labs takes India's street culture and puts regional craft on the sole of a sneaker — this drop runs through Himachal weaves, Punjab embroidery, and Rajasthani jute.

    Buransh Red is built around handwoven Kullu fabric from Himachal Pradesh, worn traditionally as a shawl textile and reworked here into the sneaker's upper. The 1928 Turf Olive carries gold-embroidered Phulkari patterns — Punjab's centuries-old floral embroidery craft — across a vintage runner silhouette. Aandhi Kobicha is built from raw jute, a nod to resilience and street culture, made in collaboration with RAGA. Baaz Indrani draws its embroidery from the grace of Indian classical dance, made with PRXKHXR, while Baaz Leila Navy and Barfi Burgundy round out the drop for everyday wear.

