# Mela Social Campaign — YAML Format
# Template for strict machine-readable campaign logging
# Use this structure for all campaign files: [brand-slug]-week-[N]-campaign.yaml
#
# COPY GUARDRAILS (see social-content-strategy-prd.md → Caption Strategy & Persona
# Guardrails for the full banned-phrase list): never "Shipped to the US" without
# naming the brand as the actor; never "traditional/ethnic/Bollywood/costume";
# never "ethically made/sustainable/vegan-friendly" without a specific cert.
# This template's own example copy below is a compliant reference — copy its
# pattern, not older campaign logs, which predate this rule being enforced.

