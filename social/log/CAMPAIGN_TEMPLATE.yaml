hypothesis: ""             # one line: which angle / hook / persona this post is testing (cheap learning instrument; replaces per-post 13-dim scoring during warmup)
gate_verdict: ship         # ship | block  (single pre-publish-gate.md pass; no REVISE during warmup)
coaching_notes: ""         # logged, non-blocking: diaspora anchor (the loud one), hook, first-frame, motion — notes only, never halted this ship
northstar_metric:          # fill in AFTER publish; builds the baseline the deferred scoring will use. Roll into metrics-log.md at the Sunday review.
