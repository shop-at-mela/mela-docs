    - name: r/IndiaMoms
      note: "Already-active per accounts.md; diaspora parents ordering festive/kids apparel from India hit this exact sizing confusion."
  title: "PSA: Indian clothing and shoe sizes are not the same as US sizes, even when the label says so"
  body: |
    If you've ordered clothing or shoes from an Indian brand online and been surprised by the fit, here's why.

    Most Indian apparel brands size to UK or EU numbering, not US. A label that says "Medium" can correspond to a different chest or bust measurement depending on which country's chart the brand uses. It is not the same "Medium" you are used to from a US retailer.

    Footwear is the biggest gap. Indian shoe sizing almost always follows the UK scale, which runs about a full size below the equivalent US number. A UK 6 is close to a US women's 8.5, not a US 6.

    Before you order: find the brand's actual measurement chart in inches or centimeters, not just the size name, and compare it to your own measurements. The label name is the least reliable part of the listing. The numbers are not.
