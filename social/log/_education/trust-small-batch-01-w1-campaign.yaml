    into the original post"). Verify each candidate subreddit's current self-promotion rules
    before posting, per the doc's own caveat.
  title: "PSA: if your order from a small Indian brand is taking longer than Amazon, that's usually a feature, not a bug"
  body: |
    Posting this because I see the "why is this taking 2 weeks" question a lot in threads here.

    A lot of small Indian brands (handloom, hand-painted ceramics, small-batch skincare, that kind of thing) don't keep a warehouse of pre-made stock the way a mass retailer does. A bunch of pieces get finished, checked, or even made after you place the order, not pulled off a shelf. That's also why two "identical" pieces from the same brand are sometimes slightly different. A human checked them, not a machine sampling every tenth one off a line.

    None of this is a defense of actually bad communication or a brand that goes dark on you. But if the timeline itself is a little longer than what you're used to from big retailers, it's usually not a red flag by itself, it's often just what small-batch production actually looks like.

    Curious if others have noticed this pattern with brands they've ordered from.

