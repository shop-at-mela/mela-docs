  caption: |
    A machine can print a pattern in a second. A handloom weaver spends a full day on one yard of cloth.

    The warp threads go onto the loom one by one, then a weaver throws the shuttle back and forth, row by row, building the pattern as they go. No computer guides the next pass. That is still how many contemporary Indian textile brands make their fabric today, not a process kept behind glass in a museum.

    So the next time a handloom piece looks slightly uneven from one end to the other, that is not a defect. That is the part a machine cannot do.

    Discover more from independent Indian brands on Mela →

