<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mela — Cert Decode: Hook</title>
<link rel="stylesheet" href="mela-kit.css">
<style>
  /* Slide 1 (hook) for a trust_service claims-decode reel. A hook, NEVER a product.
     Navy + marigold worn openly (this is a Mela utility, not a product ad). */
  .card { justify-content: center; }
  .quotes { font-size: 7.4vmin; line-height: 1.16; color: var(--ink); margin: 0 0 2.2vmin; }
  .headline { font-size: 8.6vmin; line-height: 1.06; color: var(--ink); margin: 0; }
  .headline .accent { color: var(--navy); font-style: italic; }
  .subline { font-size: 4.4vmin; color: var(--muted); margin-top: 4.5vmin; font-style: italic; line-height: 1.3; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">Reading a clothing tag</div>
    <div class="rule"></div>
    <h1 class="quotes">&ldquo;Sustainable.&rdquo; &ldquo;Vegan.&rdquo; &ldquo;Ethical.&rdquo;</h1>
    <h1 class="headline">Nobody <span class="accent">regulates</span> these words.</h1>
    <div class="subline">Anyone can print them. Here's what to actually check.</div>
    <div class="watermark">Discovered on <b>Mela</b></div>
  </div>
</body>
</html>
