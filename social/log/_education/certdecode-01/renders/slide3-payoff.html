<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mela — Cert Decode: Payoff</title>
<link rel="stylesheet" href="mela-kit.css">
<style>
  /* Payoff slide (no product): navy card, marigold accent. Lands the takeaway +
     the soft, honest Mela tie-in (materials + origin on every listing). */
  .card { background: var(--navy); justify-content: center; }
  .kicker { color: var(--marigold); }
  .rule { background: var(--marigold); }
  .headline { font-size: 8.8vmin; line-height: 1.08; color: var(--cream); margin: 0; }
  .headline .accent { color: var(--marigold); font-style: italic; }
  .subline { font-size: 4.2vmin; color: #cfc9e2; margin-top: 5vmin; line-height: 1.38; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">The takeaway</div>
    <div class="rule"></div>
    <h1 class="headline">Check the <span class="accent">tag</span>,<br>not the tagline.</h1>
    <div class="subline">Every brand on Mela lists its materials and origin on the product page. So you can do exactly this before you buy.</div>
    <div class="watermark watermark--light">Discovered on <b>Mela</b></div>
  </div>
</body>
</html>
