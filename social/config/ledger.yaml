- id: _education/chikankari-01-w1-campaign
  status: live
  format: carousel
  posted_at: '2026-08-09T15:00:00+00:00'
  brands:
  - house-of-chikankari
  caption: 'Real chikankari or a printed lookalike? Most people cannot tell at a glance. Here is how to
    check.


    One. Real hand work feels soft, like part of the fabric. A print sits flat on top.

    Two. Flip it over. Hand embroidery leaves a clean threaded back. A print leaves nothing.

    Three. Look for slight irregularity from stitch to stitch. Machine perfect is too perfect.

    Four. Jali, the fine net stitch, has no machine equivalent. If you see it, it is hand done.


    Chikankari is Lucknow''s shadow work embroidery. Around 250,000 artisans keep it alive today, most
    of them women. The black kurta here is hand embroidered by @houseofchikankari.in in Lucknow.


    Discover House of Chikankari on Mela, link in bio


    #Chikankari #Lucknow #HandEmbroidered #IndianCraft #SlowFashion

    '
