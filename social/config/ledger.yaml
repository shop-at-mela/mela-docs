  caption: 'A US Medium isn''t an Indian Medium. Here''s how the numbers actually convert.


    Many Indian brands size to UK or EU numbers, not US. A label that says "Medium" can mean a different
    measurement depending on the country, and footwear almost always runs in UK sizing, about a full size
    under the US number.


    The fix is simple. Check the brand''s own measurement chart before you order, not just the label name.


