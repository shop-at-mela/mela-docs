  caption: 'Set your festive table with a story this Diwali — Kaunteya''s hand-painted fine bone china
    brings centuries-old Indian art traditions to everyday tableware.


    Each piece is wheel-thrown, then hand-painted by trained artisans: the Airavata mugs draw their motifs
    from Pattachitra scroll painting — a centuries-old narrative art form from Odisha depicting the vahanas
    (divine mount animals) of Hindu mythology — while the Byah collection is inspired by Bappuji ki Phad,
    a Rajasthani folk-painting tradition.


