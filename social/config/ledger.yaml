  brands: []
  caption: 'How long does it actually take to get something from India?


    Here is the honest version. You discover a brand on Mela, then buy on the brand''s own site. Most
    makers pack your order in one to three days because it is small batch, not sitting in a warehouse.
    Then it ships by tracked courier and usually lands within two weeks.


    One thing to check before you buy: duties. Some brands prepay them so you see one price at checkout.
    Many do not, which means you may owe a customs fee on delivery. It varies by brand, so read the shipping
    page first.


    No mystery, just logistics.


